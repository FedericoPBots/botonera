# Arma el receptor para Windows, Linux y Mac, y lo deja en la release "receptor".
name: receptor

on:
  push:
    branches: [main]
    paths: ["receptor/**", ".github/workflows/receptor.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: receptor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: receptor/go.mod
          cache-dependency-path: receptor/go.sum
      # Cada paquete trae su LEEME.txt: la instalación de ese sistema y después la guía común.
      - name: Windows
        run: |
          mkdir -p dist/windows/Botonera
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-H windowsgui -s -w" -o dist/windows/Botonera/Botonera.exe .
          cat leeme/windows.txt leeme/comun.txt | sed 's/$/\r/' > dist/windows/Botonera/LEEME.txt
          (cd dist/windows && zip -qr ../Botonera-windows.zip Botonera)
      - name: Linux
        run: |
          mkdir -p dist/linux/Botonera
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w" -o dist/linux/Botonera/botonera .
          cat leeme/linux.txt leeme/comun.txt > dist/linux/Botonera/LEEME.txt
          tar -czf dist/Botonera-linux-amd64.tar.gz -C dist/linux Botonera
      - uses: actions/upload-artifact@v4
        with:
          name: windows-linux
          path: |
            receptor/dist/Botonera-windows.zip
            receptor/dist/Botonera-linux-amd64.tar.gz

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: receptor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: receptor/go.mod
          cache-dependency-path: receptor/go.sum
      # Un solo .app para Apple Silicon e Intel; firma ad-hoc (sin cuenta de Apple).
      - name: Botonera.app
        run: |
          CGO_ENABLED=1 GOARCH=arm64 go build -ldflags "-s -w" -o dist/botonera-arm64 .
          CGO_ENABLED=1 GOARCH=amd64 go build -ldflags "-s -w" -o dist/botonera-amd64 .
          app=dist/Botonera/Botonera.app
          mkdir -p $app/Contents/MacOS
          lipo -create -output $app/Contents/MacOS/Botonera dist/botonera-arm64 dist/botonera-amd64
          cp mac/Info.plist $app/Contents/Info.plist
          codesign --force --deep -s - $app
          cat leeme/mac.txt leeme/comun.txt > dist/Botonera/LEEME.txt
          ditto -c -k --keepParent dist/Botonera dist/Botonera-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: receptor/dist/Botonera-mac.zip

  release:
    needs: [windows-linux, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Release "receptor"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view receptor >/dev/null 2>&1 || gh release create receptor --title "Receptor" --notes "Receptor de escritorio de la Botonera, rearmado en cada cambio."
          gh release upload receptor dist/* --clobber
          # El .exe suelto de la primera versión ya no se publica.
          gh release delete-asset receptor Botonera.exe -y 2>/dev/null || true
